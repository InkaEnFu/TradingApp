<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Investment Simulator</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 0 auto;
            padding: 2rem;
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 100%;
        }
        .auth-card h2 {
            color: var(--light-purple);
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
            border: none;
            padding: 0;
        }
        .auth-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 2rem;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .auth-tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            cursor: pointer;
            background: rgba(107,70,193,0.1);
            color: var(--text-muted);
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }
        .auth-tab:hover {
            background: rgba(107,70,193,0.25);
            transform: none;
            box-shadow: none;
        }
        .auth-tab.active {
            background: var(--accent-purple);
            color: white;
        }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .auth-error {
            background: rgba(245,101,101,0.15);
            border: 1px solid rgba(245,101,101,0.3);
            color: var(--danger);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        .auth-success {
            background: rgba(72,187,120,0.15);
            border: 1px solid rgba(72,187,120,0.3);
            color: var(--success);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }
        .auth-card button[type="submit"] {
            width: 100%;
            margin-top: 0.5rem;
        }
        .auth-card input[type="password"] {
            width: 100%;
            padding: 0.875rem;
            background: rgba(10,10,10,0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .auth-card input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(107,70,193,0.2);
        }
        .auth-card input[type="password"]::placeholder {
            color: var(--text-muted);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .auth-logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--light-purple) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Investment Simulator</h1>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>Welcome</h1>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <div id="form-login" class="auth-form active">
                <div id="login-error" class="auth-error"></div>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" placeholder="Enter username" required minlength="3" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter password" required minlength="4" autocomplete="current-password">
                    </div>
                    <button type="submit" id="login-btn">Login</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="form-register" class="auth-form">
                <div id="register-error" class="auth-error"></div>
                <div id="register-success" class="auth-success"></div>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="reg-username">Username</label>
                        <input type="text" id="reg-username" placeholder="Choose a username (min 3 chars)" required minlength="3" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" placeholder="Choose a password (min 4 chars)" required minlength="4" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="reg-password2">Confirm Password</label>
                        <input type="password" id="reg-password2" placeholder="Confirm your password" required minlength="4" autocomplete="new-password">
                    </div>
                    <button type="submit" id="register-btn">Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Check if already logged in
        fetch('/api/auth/me').then(r => {
            if(r.ok) window.location.href = '/';
        });

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            if(tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('form-login').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('form-register').classList.add('active');
            }
            // Clear errors
            document.querySelectorAll('.auth-error, .auth-success').forEach(e => e.style.display = 'none');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const errEl = document.getElementById('login-error');
            errEl.style.display = 'none';
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            if(!username || !password) { errEl.textContent = 'Fill in all fields.'; errEl.style.display = 'block'; return; }
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if(res.ok) {
                    window.location.href = '/';
                } else {
                    errEl.textContent = data.error || 'Login failed.';
                    errEl.style.display = 'block';
                }
            } catch(err) {
                errEl.textContent = 'Connection error.';
                errEl.style.display = 'block';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const errEl = document.getElementById('register-error');
            const sucEl = document.getElementById('register-success');
            errEl.style.display = 'none';
            sucEl.style.display = 'none';
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;
            const password2 = document.getElementById('reg-password2').value;
            if(!username || !password) { errEl.textContent = 'Fill in all fields.'; errEl.style.display = 'block'; return; }
            if(password !== password2) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return; }
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if(res.ok) {
                    window.location.href = '/';
                } else {
                    errEl.textContent = data.error || 'Registration failed.';
                    errEl.style.display = 'block';
                }
            } catch(err) {
                errEl.textContent = 'Connection error.';
                errEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>
