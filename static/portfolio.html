<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Portfolio</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>💼 ZenMarket</h1>
            <nav>
                <a href="/">Market</a>
                <a href="/portfolio">Portfolio</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>Your Portfolio</h2>
            <div id="portfolio-summary" style="margin-bottom: 20px;">
                <h3>Hodnota portfolia momentálně: <span id="total-value">-</span></h3>
                <p style="font-size: 1.2em;">
                    Za posledních 24 hodin: 
                    <span id="change-24h" style="font-weight: bold;">-</span>
                    (<span id="change-24h-percent" style="font-weight: bold;">-</span>)
                </p>
                <div style="margin-top: 20px;">
                    <div class="chart-period-buttons" style="display:flex; gap:0.4rem; margin-bottom:0.5rem;">
                        <button class="period-btn" onclick="switchPortfolioPeriod('24h',this)">24H</button>
                        <button class="period-btn" onclick="switchPortfolioPeriod('1w',this)">1W</button>
                        <button class="period-btn" onclick="switchPortfolioPeriod('1m',this)">1M</button>
                        <button class="period-btn" onclick="switchPortfolioPeriod('1y',this)">1Y</button>
                        <button class="period-btn" onclick="switchPortfolioPeriod('max',this)">MAX</button>
                    </div>
                    <canvas id="portfolio-chart" style="max-height: 300px;"></canvas>
                </div>
            </div>
            <div id="portfolio"></div>
        </div>

        <div class="card">
            <h2>Asset Allocation</h2>
            <div id="allocation-map" class="allocation-map"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
